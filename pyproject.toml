# This pyproject.toml is the config-file for this workspace and its development-tools.
#
# Official documentation:
#  - https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
#
# Notes:
#  - Sort toplevel keys alphabetically.
#  - As a general rule, sort keys within tables alphabetically.
#  - Always sort dependencies alphabetically.
#  - Separate top-level sections by a two blank lines.
#  - Separate sub-sections by a single blank line.
#  - Use single-quoted strings in TOML for regular expressions.
#    It's the equivalent of r-strings in Python. Multiline strings are treated as
#    verbose regular expressions by Black. Use [ ] to denote a significant space character.


# https://docs.astral.sh/uv/concepts/projects/config/#build-systems
[build-system]
requires = ["uv_build>=0.10,<0.13.0"]
build-backend = "uv_build"


[project]
name = "uv-developer"
version = "0.1.1.dev1"
license = { file = "license.md" }
description = "Toggle [tool.uv.sources] local path overrides in pyproject.toml on and off, and guard against committing them."
readme = "docs/readme.md"
requires-python = ">=3.9"
authors = [{ name = "Wouter Vanden Hove", email = "wouter@libranet.eu" }]
maintainers = [{ name = "Wouter Vanden Hove", email = "wouter@libranet.eu" }]
keywords = ["uv", "pyproject.toml", "dependencies", "editable-install", "local-development", "pre-commit", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "cyclopts>=4.25,<5",  # cyclopts>=4 changed App.__call__ to always sys.exit(), breaking CLI tests
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.6",
    "toml-cli>=0.7.0",
]
docs = [
    "docutils!=0.21",  # Work-around for https://github.com/pypi/warehouse/issues/15749
    "markupsafe>=2.1",
    "mdformat>=0.7",
    "mdformat-gfm>=0.3",
    "mdformat-frontmatter>=2.0",
    "mdformat-tables>=1.0",
    "myst-parser>=3.0",
    "sphinx>=7.1",
    "sphinx-autoapi>=3.3",
    "sphinx-rtd-theme>=3.0",
]
packaging = [
    "pyroma>=4.2",
]
pre-commit = [
    "codespell>=2.4.3",
    "pre-commit>=3.5",  # 3.5 still supports python3.8
    "pre-commit-hooks>=5.0.0",
    "prek>=0.2.28",
]
testing = [
    "mutmut>=3.3",
    "pytest>=8.1",
    "pytest-clarity>=1.0",
    "pytest-cov>=5.0.0",
    "pytest-dotenv>=0.5",
    "pytest-freezer>=0.4.9",
    "pytest-mock>=3.15",
    "pytest-xdist>=3.8.0",
]
typing = [
    "ty>=0.0.1a17",
    "types-toml>=0.10",
]

[project.scripts]
uv-developer = "uv_developer.cli:app"

[project.urls]
homepage = "https://github.com/libranet/uv-developer"
repository = "https://github.com/libranet/uv-developer"
"Changelog" = "https://github.com/libranet/uv-developer/blob/main/docs/changes.md"
"Issues" = "https://github.com/libranet/uv-developer/issues"
"Releases" = "https://github.com/libranet/uv-developer/releases"
documentation = "https://uv-developer.readthedocs.io"


[tool.codespell]
# awaiting qupport for .gitignore
# see https://github.com/codespell-project/codespell/issues/1887
# for now use: uv run codespell $(git ls-files)
ignore-words-list = "Hove"
skip = "uv.lock, var"


[tool.coverage.html]
# https://coverage.readthedocs.io/en/latest/config.html
directory = "var/coverage/html"

[tool.coverage.xml]
output = "var/coverage/coverage.xml"

# [tool.coverage.paths]
# source = ["src", "*/site-packages"]
# tests = ["tests", "*/tests"]

[tool.coverage.report]
# cfr. https://coverage.readthedocs.io/en/coverage-4.2/excluding.html
exclude_lines = [
    "if tp.TYPE_CHECKING:",
    "pragma: no cover",
]
fail_under = 100
include = ["src/*"]
# omit = ["*tests*"]
# show_missing = true

[tool.coverage.run]
branch = true
data_file = "var/coverage/coverage.db"
source = ["uv_developer", "tests"]


[tool.mutmut]
# cfr. https://mutmut.readthedocs.io/en/latest/#configuration
paths_to_mutate = [ "src/" ]
pytest_add_cli_args_test_selection= [ "tests/" ]


[tool.pytest.ini_options]
# Settings reference: https://docs.pytest.org/en/stable/reference/customize.html
cache_dir = "var/cache/pytest"
log_cli = false  # enable to show log-output
log_cli_level = "NOTSET"
filterwarnings = []
markers = ["unit", "integration"]
pythonpath = ["tests"]  # add to sys.path to make _helpers importable
testpaths = ["tests"]  # search for test-files


[tool.ruff]
# Settings reference: https://docs.astral.sh/ruff/configuration/
cache-dir = "var/cache/ruff" # relative to project_root
fix = true
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with ruff format
    "CPY001",  # missing copyright notice at top of file
    "ERA001",  # found commented code
    "G004",    # logging statement uses f-string
    "T201",    # print statement found
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.isort]
# Settings reference: https://docs.astral.sh/ruff/settings/#lintisort

# https://docs.astral.sh/ruff/settings/#lintisort
# combine-as-imports = true
combine-as-imports = false
force-single-line = false
force-sort-within-sections = false  # sort straight-style imports before from-style imports
from-first = false
known-third-party = []
known-first-party = ["uv_developer"]
known-local-folder = ["_helpers"]

[tool.ruff.lint.per-file-ignores]
"docs/**" = [
    "INP001",  # docs-dir should not be a python-package
    ]
"tests/**" = [
    "ANN",     # missing type annotation
    "D103",    # missing docstring in public function
    "INP001",  # tests-dir should not be a python-package
    "PLC0415", # 'import' should be at top-level of file
    "S101",    # use of `assert` detected
    ]

[tool.ruff.lint.pydocstyle]
# pep257 disables numpy/google-style section-formatting rules
convention = "pep257"


[tool.ty]
# https://docs.astral.sh/ty/reference/configuration/

[tool.ty.analysis]
# Disable support for `type: ignore` comments
respect-type-ignore-comments = true

[tool.ty.environment]
# extra-paths = ["docs/"]

[tool.ty.rules]
possibly-unresolved-reference = "warn"
division-by-zero = "ignore"

[tool.ty.src]
include = [
    "src",
    "tests",
]


[tool.uv]
# Settings reference: https://docs.astral.sh/uv/reference/settings/
exclude-newer = "10 days"
# exclude-newer-package = { setuptools = "30 days" }

keyring-provider = "subprocess"
managed = true
package = true
default-groups = "all"

# [[tool.uv.index]]
# Settings reference: https://docs.astral.sh/uv/reference/settings/#index

[tool.uv.sources]
# Settings reference: https://docs.astral.sh/uv/reference/settings/#sources
# Enable temporary local path overrides for development, but do not commit.
# The name-key must match the actual normalized project.name in pyproject.toml.

